name: SimplifyPress
slug: simplifypress
tagline: WordPress site workflow
status: planned
order: 40
accent: '#60A5FA'

summary: >-
  Staging, review and release for WordPress sites — so a content change and a
  plugin update stop being the same kind of risk.

hero:
  eyebrow: SimplifyPress
  headline: Ship WordPress changes on purpose
  sub: >-
    Preview links for editors, update batches you can roll back, and a record of
    who changed what — without turning the site into a build pipeline.
  ctas:
    - label: Join the waitlist
      href: /contact/?product=simplifypress
      variant: primary
    - label: See what we're building
      href: /blog/
      variant: ghost

features:
  - title: Review before it is live
    body: >-
      Editors get a shareable preview URL for a draft, including template and
      block changes, without a staging site anyone has to maintain.
    wide: true
  - title: Batched updates
    body: >-
      Apply plugin and theme updates as one reviewable set, with a visual diff
      of key pages before and after.
  - title: One-click rollback
    body: >-
      A snapshot before every batch. If a page breaks, go back and investigate
      afterwards rather than under pressure.
  - title: Change log
    body: >-
      Who updated what and when, in a form you can hand to a client without
      apologising for it.

howItWorks:
  - title: Install
    body: One plugin, no server access required.
  - title: Set a review policy
    body: >-
      Decide which changes need a preview and who signs them off. Everything
      else keeps working the way it does now.
  - title: Release
    body: Approve the batch. Snapshot, apply, verify, and log.

integrations:
  - WordPress
  - WooCommerce
  - xCloud
  - WP-CLI
  - GitHub
  - Slack

faqs:
  - q: Do I need a staging server?
    a: >-
      No. Previews are rendered from the live site with the pending change
      applied for that request only.
  - q: Does this replace my host's staging?
    a: >-
      It complements it. Host staging is good for big migrations; SimplifyPress
      is for the daily changes that never justified a full staging cycle.
