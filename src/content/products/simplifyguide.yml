howItWorks:
  - title: Install
    body: >-
      Add the plugin to any WordPress site. A two-minute setup wizard covers
      privacy, brand, AI and who sees new guides.
  - title: Record
    body: >-
      Press Record and do the task. Steps, screenshots and instructions appear
      as you go; press Finish when you are done.
  - title: Share
    body: >-
      Publish it to your Help Center, walk people through it with Show me, or
      export it as video, PDF, Word and more.

