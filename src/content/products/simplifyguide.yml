faqs:
  - q: Is it really free?
    a: >-
      Yes. Recording, Show me, Smart Blur, annotations, version history and
      every export format are in the free plugin, with no limit on guides or
      people. Pro will add hosted conveniences — AI without your own key and
      cloud share links — not features taken out of the free version.
  - q: Do my screenshots or data leave my server?
    a: >-
      No. Guides are stored as WordPress posts and screenshots in your Media
      Library. If you turn on AI writing, only the step text and a little page
      context go to the provider you chose, never the screenshots.
  - q: Which AI providers does it work with?
    a: >-
      Anthropic (Claude), OpenAI, DeepSeek, OpenRouter, Groq, any
      OpenAI-compatible server including one you run yourself, and the AI
      connection built into WordPress. AI is optional: without it every step
      still gets a clear, rule-based instruction.
  - q: What does Smart Blur hide?
    a: >-
      Email addresses, phone numbers, US social security numbers, card numbers,
      IP and MAC addresses and common API key formats, in text and in form
      fields. You choose the categories, and can blur any other element by
      clicking it while recording.
  - q: How is Show me different from a product tour plugin?
    a: >-
      Tour plugins make you build each tour by hand, element by element. Show
      me plays back a guide you recorded by simply doing the task, finds the
      same elements on the live screen, and copes when the reader is on the
      wrong page or has already done a step.
  - q: Can it record tools outside WordPress?
    a: >-
      Not yet. It records anything inside your WordPress site, admin and front
      end. A browser extension that captures other web apps and publishes to
      your site is planned.
  - q: I make a WordPress plugin. Can I use it for my plugin's onboarding?
    a: >-
      Yes — that is one of the best uses. Record the setup on your own site,
      then export it as video for your WordPress.org listing, GIFs for your
      readme, HTML or Markdown for your docs, and a SimplifyGuide file that
      any site running SimplifyGuide can import and play with Show me. A small
      player you can ship inside your own plugin, so the walkthrough runs for
      users who do not have SimplifyGuide, is planned.
  - q: Is SimplifyGuide a Scribe, Tango or Guidde alternative?
    a: >-
      For work that happens in WordPress, yes — with the difference that it is
      free, self-hosted and uses your own AI. For documenting many SaaS tools
      across a company, those products capture more places today.
  - q: Which languages does it support?
    a: >-
      The interface is available in English, Chinese, Spanish, Portuguese,
      French and German, and AI-written steps can be produced in any language
      you set.
  - q: Where do I download it?
    a: >-
      Ask for it through the contact page and we will send the plugin the same
      day. The WordPress.org listing is on its way; once it is live, the
      download button here will point straight to it.
