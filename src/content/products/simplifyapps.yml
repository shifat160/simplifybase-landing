name: SimplifyApps
slug: simplifyapps
tagline: SaaS tools for forms and operations
status: planned
order: 50
accent: '#F472B6'

summary: >-
  Internal tools without the internal tools project — forms, approvals and
  operational dashboards assembled from your existing data.

hero:
  eyebrow: SimplifyApps
  headline: The internal tool you keep not building
  sub: >-
    Every team has three spreadsheets doing the job of an app. SimplifyApps
    turns them into forms, approvals and dashboards that other people can
    actually use.
  ctas:
    - label: Join the waitlist
      href: /contact/?product=simplifyapps
      variant: primary
    - label: See what we're building
      href: /blog/
      variant: ghost

features:
  - title: Forms with logic
    body: >-
      Conditional fields, calculated values, and validation that runs on the
      server rather than only in the browser. Submissions land wherever the work
      already happens.
    wide: true
  - title: Approval chains
    body: >-
      Route a submission through the people who need to see it, with reminders
      and a clear record of who approved what.
  - title: Operational dashboards
    body: >-
      Read-only views on your own data for the people who need the numbers but
      should not be in the admin.
  - title: Permissions that make sense
    body: >-
      Roles defined by what someone does, not by which database table they
      happen to need.

howItWorks:
  - title: Point at your data
    body: Connect a database, a sheet, or a SimplifyBase product.
  - title: Assemble
    body: Compose a form or dashboard from fields you already have.
  - title: Share
    body: >-
      Send a link. Access is scoped per person, and every change is attributed.

integrations:
  - Google Sheets
  - Airtable
  - Postgres
  - WooCommerce
  - Slack
  - Zapier

faqs:
  - q: Is this a no-code builder?
    a: >-
      It is low-code by default with an escape hatch. Most things assemble
      without code; when you need real logic, you can write it.
  - q: Where does the data live?
    a: >-
      In your source of truth. SimplifyApps reads and writes it rather than
      becoming another copy to reconcile.
