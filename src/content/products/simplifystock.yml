faqs:
  - q: Does my sales data leave my server?
    a: >-
      Not by default. The free plan forecasts entirely inside your WordPress
      install. Hosted forecasting is opt-in on Pro, and processes order
      quantities and dates only — never customer records.
  - q: How much history does it need?
    a: >-
      Around eight weeks of orders produces a usable forecast. Twelve months
      lets it model seasonality properly. Products with no history fall back to
      a category-level estimate and are flagged as low confidence.
  - q: Will it work with my inventory plugin?
    a: >-
      SimplifyStock reads WooCommerce's own stock fields, so anything that
      writes to those works alongside it. Plugins that keep stock in their own
      tables need the bridge described in the docs.
  - q: What happens if I cancel Pro?
    a: >-
      You drop to the free plan. Nothing is deleted — forecasts stay, and the
      Pro-only features simply stop updating.
