name: SimplifyCommerce
slug: simplifycommerce
tagline: Shopify and commerce automation
status: planned
order: 20
accent: '#A78BFA'

summary: >-
  The operational glue between your storefront, your suppliers and your
  spreadsheets — order routing, fulfilment rules and reconciliation, automated.

hero:
  eyebrow: SimplifyCommerce
  headline: The busywork between orders
  sub: >-
    Every store ends up with a person whose job is moving data between systems.
    SimplifyCommerce is the rules engine that replaces that job.
  ctas:
    - label: Join the waitlist
      href: /contact/?product=simplifycommerce
      variant: primary
    - label: See what we're building
      href: /blog/
      variant: ghost

features:
  - title: Rules, not scripts
    body: >-
      Route orders by value, region, SKU or supplier with conditions you can
      read out loud. No webhooks to host, no cron jobs to babysit.
    wide: true
  - title: Multi-channel stock
    body: >-
      One stock truth across Shopify, WooCommerce and your marketplace listings,
      reconciled continuously rather than nightly.
  - title: Supplier handoff
    body: >-
      Dropship and 3PL orders sent in the format each partner actually accepts,
      with acknowledgement tracking.
  - title: Reconciliation
    body: >-
      Payouts matched against orders, refunds and fees, with the gaps listed
      instead of silently absorbed.

howItWorks:
  - title: Connect your channels
    body: Shopify, WooCommerce and marketplaces authenticate in a few clicks.
  - title: Describe the rule
    body: >-
      Pick a trigger, add conditions, choose the action. Test it against real
      historical orders before it goes live.
  - title: Let it run
    body: >-
      Every run is logged with its inputs and outputs, so when something looks
      wrong you can see exactly what happened.

integrations:
  - Shopify
  - WooCommerce
  - Amazon
  - Etsy
  - ShipStation
  - Xero

faqs:
  - q: When does it ship?
    a: >-
      SimplifyCommerce is in design. Waitlist members get early access builds
      and help shape the rule vocabulary before it is fixed.
  - q: Will it replace Zapier for my store?
    a: >-
      For commerce workflows, that is the intent — with commerce-native
      concepts like orders, SKUs and payouts as first-class objects rather than
      as generic JSON.
